name: Weekly Veterinary Legislative Tracker

on:
  schedule:
    - cron: "0 23 * * 0"
  workflow_dispatch:
    inputs:
      send_digest:
        description: "Send email digest after run?"
        required: false
        default: "true"
        type: boolean

jobs:
  scrape-and-build:
    name: Run Tracker Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install requests beautifulsoup4 lxml pdfplumber anthropic python-dotenv

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Create required directories
        run: |
          mkdir -p data logs frontend

      - name: Run legislative bill scraper
        env:
          LEGISCAN_API_KEY: ${{ secrets.LEGISCAN_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python scraper/scrape_bills.py

      - name: Verify tracker_data.json was created
        run: |
          ls -la frontend/tracker_data.json
          echo "File size: $(wc -c < frontend/tracker_data.json) bytes"

      - name: Commit tracker data to repo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/tracker_data.json
          git diff --staged --quiet || git commit -m "Update tracker_data.json [skip ci]"
          git push || true

      - name: Send weekly email digest
        if: ${{ github.event.inputs.send_digest != 'false' }}
        continue-on-error: true
        env:
          SMTP_HOST: smtp.gmail.com
          SMTP_PORT: "587"
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          DIGEST_RECIPIENTS: ${{ secrets.DIGEST_RECIPIENTS }}
          TRACKER_URL: ${{ vars.TRACKER_URL }}
        run: |
          python scraper/send_digest.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend

  deploy:
    name: Deploy to GitHub Pages
    needs: scrape-and-build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  notify-failure:
    name: Notify on Failure
    needs: [scrape-and-build, deploy]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Send failure notification
        continue-on-error: true
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          DIGEST_RECIPIENTS: ${{ secrets.DIGEST_RECIPIENTS }}
        run: |
          python -c "
          import smtplib, os
          from email.mime.text import MIMEText
          msg = MIMEText('The weekly Vet Legislative Tracker pipeline failed.')
          msg['Subject'] = '[Vet Tracker] Weekly Pipeline FAILED'
          msg['From'] = os.environ['SMTP_USER']
          msg['To'] = os.environ['DIGEST_RECIPIENTS']
          with smtplib.SMTP('smtp.gmail.com', 587) as s:
              s.starttls()
              s.login(os.environ['SMTP_USER'], os.environ['SMTP_PASS'])
              s.sendmail(msg['From'], msg['To'].split(','), msg.as_string())
          " || echo 'Could not send failure notification'
